name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Detect frontend folder
        shell: bash
        run: |
          if [ -d "./frontend" ]; then
            echo "FRONTEND_DIR=./frontend" >> "$GITHUB_ENV"
          elif [ -d "./GreenFarmify/frontend" ]; then
            echo "FRONTEND_DIR=./GreenFarmify/frontend" >> "$GITHUB_ENV"
          else
            echo "No se encontró la carpeta frontend/"
            exit 1
          fi

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.FRONTEND_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
